prometheus:
  prometheusSpec:
    retention: 24h
    serviceMonitorSelectorNilUsesHelmValues: false

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "gp2"
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  alertmanagerSpec:
    storage: {}

grafana:
  enabled: true

  service:
    type: ClusterIP

  adminUser: admin

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
