# Values for the monitoring chart. Environment-specific settings go in
# kubernetes/deploy/envs/<env>/monitoring.yaml, passed in by the ArgoCD app.
grafana:
  service:
    name: prometheus-grafana
    port: 80

  # Fixed URL for Grafana through Traefik. Off by default; each env turns it on.
  ingressRoute:
    enabled: false
    host: ""                 
    entryPoints:
      - websecure
    middlewares: []          
    tls:
      enabled: true
      clusterIssuer: ""   
        