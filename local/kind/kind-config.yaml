# kind cluster definition for local Kubernetes testing.
# Docs: https://kind.sigs.k8s.io/docs/user/configuration/
#
# The node image is NOT set here on purpose. It is passed in by kind.mk
# (KIND_NODE_IMAGE) so the Kubernetes version lives in one place.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: eks-v2-local

nodes:
  # Control plane. Traefik runs here (see traefik-values.yaml) and binds the
  # node's port 80, which is mapped to http://localhost:8080 on your machine.
  # Port mappings are fixed at creation: changing them needs a new cluster.
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP

  # Two workers so replicas can spread across nodes. This lets you test
  # anti-affinity and topology spread rules from the staging/prod values.
  - role: worker
  - role: worker
