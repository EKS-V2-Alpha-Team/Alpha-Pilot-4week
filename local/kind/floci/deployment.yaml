apiVersion: apps/v1
kind: Deployment
metadata:
  name: floci
  labels:
    app.kubernetes.io/name: floci
    app.kubernetes.io/part-of: kind-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: floci
  template:
    metadata:
      labels:
        app.kubernetes.io/name: floci
    spec:
      # Prevent Kubernetes service-link variables from overriding Floci's port configuration.
      enableServiceLinks: false
      containers:
        - name: floci
          image: floci/floci:2.2.0-compat
          env:
            - name: FLOCI_HOSTNAME
              value: floci
            - name: AWS_REGION
              value: eu-west-2
            - name: AWS_DEFAULT_REGION
              value: eu-west-2
          ports:
            - name: http
              containerPort: 4566
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: init
              mountPath: /etc/floci/init/ready.d/init.sh
              subPath: init.sh
      volumes:
        - name: init
          configMap:
            name: floci-init
            defaultMode: 0755
