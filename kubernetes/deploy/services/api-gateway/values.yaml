# api-gateway: the only public entrypoint. Auth, rate limiting, routing.
component: gateway
containerPort: 8080

env:
  REDIS_URL: redis://redis:6379

# JWT_SECRET key is environment-specific: see kubernetes/deploy/envs/<env>/api-gateway.yaml

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
