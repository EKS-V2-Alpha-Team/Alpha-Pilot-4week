apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  sources:
    - repoURL: public.ecr.aws/karpenter
      chart: karpenter
      targetRevision: 1.14.1
      helm:
        releaseName: karpenter
        valueFiles:
          - $values/kubernetes/helm-values/karpenter-values.yaml
          - $values/kubernetes/helm-values/envs/{{ .Values.environment }}/karpenter-values.yaml
    - repoURL: git@github.com:EKS-V2-Alpha-Team/Alpha-Pilot-4week.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
