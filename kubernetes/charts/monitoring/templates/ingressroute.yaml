{{- with .Values.grafana }}
{{- if .ingressRoute.enabled }}
{{- $host := required "grafana.ingressRoute.host is required when grafana.ingressRoute.enabled is true" .ingressRoute.host }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
spec:
  entryPoints:
    {{- toYaml .ingressRoute.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: Host(`{{ $host }}`)
      {{- with .ingressRoute.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ .service.name }}
          port: {{ .service.port }}
  {{- if .ingressRoute.tls.enabled }}
  tls:
    secretName: grafana-tls
  {{- end }}
{{- end }}
{{- end }}
