name: Terraform Plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan"
        required: true
        type: choice
        default: all
        options:
          - all
          - dev
          - staging
          - prod
  pull_request:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-plan.yaml"

permissions:
  id-token: write
  pull-requests: write
  contents: read

jobs:
  terraform-plan:
    name: Run Terraform Plan (${{ matrix.environment }})
    # Manual runs only from main
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false # one environment failing doesn't cancel the others
      matrix:
        environment: ${{ fromJSON(inputs.environment && inputs.environment != 'all' && format('["{0}"]', inputs.environment) || '["dev","staging","prod"]') }}

    concurrency:
      group: terraform-plan-${{ matrix.environment }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    defaults:
      run:
        working-directory: ./infra/terraform/environments/${{ matrix.environment }}

    env:
      TF_VERSION: "1.16.3"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials w/ OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          echo "Initialising terraform..."
          terraform init

      - name: Terraform Format
        if: matrix.environment == 'dev' # check all code once, not three times
        run: |
          echo "Running terraform fmt check..."
          terraform fmt -check -recursive ../..

      - name: Terraform Validate
        run: |
          echo "Running terraform validate..."
          terraform validate

      - name: Run checkov
        if: matrix.environment == 'dev' # scans the whole repo, so once is enough
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12
        continue-on-error: true
        with:
          framework: terraform
          output_format: github_failed_only

      - name: Terraform Plan
        run: |
          echo "Running terraform plan..."
          terraform plan -input=false -out=tfplan.binary

      - name: Upload plan artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tfplan-${{ matrix.environment }}
          path: |
            infra/terraform/environments/${{ matrix.environment }}/tfplan.binary
            infra/terraform/environments/${{ matrix.environment }}/.terraform.lock.hcl
          include-hidden-files: true
          retention-days: 5

      - name: Post plan comment
        if: github.event_name == 'pull_request'
        uses: borchero/terraform-plan-comment@f585438eda2fa77c6f275994b92aeccd86ef3542 # v3
        with:
          token: ${{ github.token }}
          planfile: tfplan.binary
          working-directory: ./infra/terraform/environments/${{ matrix.environment }}
          header: terraform plan (${{ matrix.environment }})

      - name: Add plan to run summary
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Writing the plan to the run summary..."
          {
            echo "## Terraform plan (${{ matrix.environment }})"
            echo "To apply, run the Terraform Apply workflow with environment=${{ matrix.environment }} and terraform_plan_run_id=${{ github.run_id }}"
            echo '```'
            terraform show -no-color tfplan.binary
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
