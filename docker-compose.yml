x-database-env: &database-env
  DATABASE_URL: postgres://app:localdev@postgres:5432/orders?sslmode=disable

x-floci-env: &floci-env
  SQS_QUEUE_URL: http://floci:4566/000000000000/order-events
  AWS_ENDPOINT_URL: http://floci:4566
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test

x-service-urls: &service-urls
  ORDER_SERVICE_URL: http://order-service:8081
  INVENTORY_SERVICE_URL: http://inventory-service:8082
  PAYMENT_SERVICE_URL: http://payment-service:8083
  NOTIFICATION_SERVICE_URL: http://notification-service:8084
  SHIPPING_SERVICE_URL: http://shipping-service:8085

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: app
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  floci:
    image: floci/floci:2.1.0-compat
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
    volumes:
      - ./scripts/floci-init.sh:/etc/floci/init/ready.d/init.sh:ro

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *service-urls
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-dev-secret
      DASHBOARD_SERVICE_URL: http://dashboard-api:8086
    depends_on:
      - redis

  order-service:
    build: ./services/order-service
    ports:
      - "8081:8081"
    environment:
      <<: [*database-env, *floci-env]
    depends_on:
      - postgres
      - floci

  inventory-service:
    build: ./services/inventory-service
    ports:
      - "8082:8082"
    environment:
      <<: *database-env
    depends_on:
      - postgres

  payment-service:
    build: ./services/payment-service
    ports:
      - "8083:8083"
    environment:
      <<: [*database-env, *floci-env]
    depends_on:
      - postgres
      - floci

  notification-service:
    build: ./services/notification-service
    ports:
      - "8084:8084"
    environment:
      <<: *database-env
    depends_on:
      - postgres

  shipping-service:
    build: ./services/shipping-service
    ports:
      - "8085:8085"
    environment:
      <<: [*database-env, *floci-env]
    depends_on:
      - postgres
      - floci

  worker:
    build: ./services/worker
    environment:
      <<: [*floci-env, *service-urls]
    depends_on:
      - floci

  scheduler:
    build: ./services/scheduler
    environment:
      <<: *database-env
    depends_on:
      - postgres

  dashboard-api:
    build: ./services/dashboard-api
    ports:
      - "8086:8086"
    environment:
      <<: *database-env
    depends_on:
      - postgres

volumes:
  pgdata: