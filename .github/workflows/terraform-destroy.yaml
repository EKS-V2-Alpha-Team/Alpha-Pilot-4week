name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      confirm:
        description: "Type the environment name again to confirm"
        required: true
        type: string
  pull_request:
    branches:
      - main
    types: [labeled]

env:
  TF_WORKING_DIR: infra/terraform/environments/${{ inputs.environment || 'dev' }}
  TF_VERSION: "1.16.3"

jobs:
  destroy-plan:
    name: Terraform Destroy Plan (${{ inputs.environment || 'dev' }})
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'destroy'
    runs-on: ubuntu-latest

    concurrency:
      group: terraform-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Check the confirmation
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "$ENVIRONMENT" ]; then
            echo "::error::Type \"$ENVIRONMENT\" in the confirm box to destroy it"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Initialize Terraform
        run: |
          echo "Initialising terraform..."
          terraform init -input=false

      - name: Terraform Destroy Plan
        run: |
          echo "Running terraform destroy plan..."
          terraform plan -destroy -input=false -out=destroy.tfplan

      - name: Upload destroy plan artifact
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-destroy-${{ inputs.environment || 'dev' }}
          path: |
            ${{ env.TF_WORKING_DIR }}/destroy.tfplan
            ${{ env.TF_WORKING_DIR }}/.terraform.lock.hcl
          include-hidden-files: true
          retention-days: 5

      - name: Post destroy plan comment
        if: github.event_name == 'pull_request'
        uses: borchero/terraform-plan-comment@f585438eda2fa77c6f275994b92aeccd86ef3542 # v3
        with:
          token: ${{ github.token }}
          planfile: destroy.tfplan
          working-directory: ${{ env.TF_WORKING_DIR }}
          header: terraform destroy plan

      - name: Add destroy plan to run summary
        run: |
          echo "Writing the destroy plan to the run summary..."
          {
            echo "## Terraform destroy plan"
            echo '```'
            terraform show -no-color destroy.tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  approve:
    name: Approve prod destroy
    needs: destroy-plan
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      issues: write
    steps:
      - name: Wait for approval
        uses: trstringer/manual-approval@fa642940caf8412403569b28b2db4a1df08a83a3 # v1.13.1
        with:
          secret: ${{ github.token }}
          approvers: ${{ vars.PROD_APPROVERS }}
          minimum-approvals: 1
          exclude-workflow-initiator-as-approver: true
          issue-title: "Approve Terraform Destroy of prod (run ${{ github.run_id }})"
          issue-body: "Started by @${{ github.actor }}. The destroy plan is in the summary of run ${{ github.run_id }}. Comment approve or deny."

  destroy:
    name: Terraform Destroy (${{ inputs.environment }})
    needs: [destroy-plan, approve]
    if: >-
      ${{ !cancelled() && github.event_name == 'workflow_dispatch'
      && needs.destroy-plan.result == 'success'
      && (needs.approve.result == 'success' || needs.approve.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.environment }}

    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download destroy plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tfplan-destroy-${{ inputs.environment || 'dev' }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Initialize Terraform
        run: |
          echo "Initialising terraform..."
          terraform init -input=false

      - name: Terraform Destroy
        run: |
          echo "Destroying the resources in the approved plan..."
          terraform apply -input=false destroy.tfplan
          echo "Destroy complete ✅"
