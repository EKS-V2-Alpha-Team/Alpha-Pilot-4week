apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: postgres-credentials
  namespace: order-platform

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: postgres-credentials
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        key: eks-v2-dev-db-credentials
        property: username

    - secretKey: password
      remoteRef:
        key: eks-v2-dev-db-credentials
        property: password
