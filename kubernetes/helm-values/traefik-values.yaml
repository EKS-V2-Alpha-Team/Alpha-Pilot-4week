deployment:
  replicas: 2

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
          topologyKey: kubernetes.io/hostname

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik

service:
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    # ip targets drop the client IP by default; api-gateway rate-limits per client IP.
    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=true
    # ExternalDNS points all three environment hostnames to the shared NLB.
    external-dns.alpha.kubernetes.io/hostname: "dashboard.dev.eksv2.naimaosmann.com,dashboard.staging.eksv2.naimaosmann.com,dashboard.prod.eksv2.naimaosmann.com"
  spec:
    loadBalancerClass: service.k8s.aws/nlb

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
    # http:// redirects to https://
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
          priority: 1

  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
