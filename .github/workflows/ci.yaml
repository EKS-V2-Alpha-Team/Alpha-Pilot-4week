name: Application Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/**"
      - ".github/workflows/ci.yaml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "services/**"
      - ".github/workflows/ci.yaml"

permissions:
  id-token: write
  contents: read
  security-events: write
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.result.outputs.services }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate path filters from services directory
        id: gen-filters
        run: |
          {
            echo "filters<<EOF"
            for dir in services/*/; do
              name=$(basename "$dir")
              echo "${name}:"
              echo "  - 'services/${name}/**'"
              echo "  - '.github/workflows/ci.yaml'"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Filter changed paths
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: ${{ steps.gen-filters.outputs.filters }}
          list-files: json

      # Manual runs (workflow_dispatch) build every service
      - name: Select services to build
        id: result
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            services=$(ls -d services/*/ | xargs -n1 basename | jq -R . | jq -sc .)
          else
            services="$CHANGED"
          fi
          echo "services=${services}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build, Scan and Push Image
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    outputs:
      image: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Run go vet
        working-directory: services/${{ matrix.service }}
        run: go vet ./...

      - name: Run unit tests
        working-directory: services/${{ matrix.service }}
        run: go test -race -count=1 ./...

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          echo "tag=${{ steps.login-ecr.outputs.registry }}/${{ secrets.AWS_ECR_REPO }}:${{ matrix.service }}-$SHA" >> $GITHUB_OUTPUT

      - name: Build image
        run: docker build -t ${{ steps.meta.outputs.tag }} ./services/${{ matrix.service }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.tag }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          scanners: vuln

      - name: Push image to ECR
        if: github.event_name == 'push'
        run: docker push ${{ steps.meta.outputs.tag }}
