# api-gateway in staging.
image:
  tag: api-gateway-0aedbc78

autoscaling:
  minReplicas: 3
  maxReplicas: 5

env:
  # Trust forwarded IP headers only from within the VPC.
  TRUSTED_PROXY_CIDRS: 10.7.0.0/16

externalSecrets:
  env:
    - name: JWT_SECRET
      key: eks-v2-staging-jwt-secret

ingressRoute:
  enabled: true
  host: dashboard.staging.eksv2.naimaosmann.com
  tls:
    clusterIssuer: letsencrypt-staging
