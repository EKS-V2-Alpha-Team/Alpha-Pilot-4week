# api-gateway in dev.
image:
  # Written by CI on every build of api-gateway. Placeholder until the first deploy.
  tag: api-gateway-replace-me

# 2 pods in dev so the PDB and zero-downtime rollouts are actually exercised.
replicaCount: 2

env:
  # VPC CIDR: Traefik pods get VPC IPs (VPC CNI), so X-Forwarded-For is trusted
  # only from inside the VPC. Needed for per-IP rate limiting behind the NLB.
  TRUSTED_PROXY_CIDRS: 10.6.0.0/16

externalSecrets:
  env:
    # Created by Terraform (module.secrets_manager).
    - name: JWT_SECRET
      key: eks-v2-dev-jwt-secret

ingressRoute:
  # Enable once the hosted zone exists and Traefik has its NLB.
  enabled: false
  # Must equal external-dns.alpha.kubernetes.io/hostname in
  # kubernetes/helm-values/traefik-values.yaml, or DNS and the certificate won't match.
  host: dashboard.dev.REPLACE_WITH_TEAM_DOMAIN
  tls:
    clusterIssuer: letsencrypt-staging
