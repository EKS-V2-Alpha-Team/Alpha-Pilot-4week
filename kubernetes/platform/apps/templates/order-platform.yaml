# Generates one Application per folder in kubernetes/deploy/services/ (<svc>-<env>).
# {{`{{ ... }}`}} is ArgoCD's own template syntax, wrapped so Helm leaves it for the ApplicationSet.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: order-platform-{{ .Values.environment }}
  namespace: argocd
  annotations:
    # After the platform (-3 to -1): the apps need Traefik, External Secrets and the CRDs.
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  # A typo in a template variable fails the ApplicationSet instead of rendering blanks.
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: git@github.com:EKS-V2-Alpha-Team/Alpha-Pilot-4week.git
        revision: main
        directories:
          - path: kubernetes/deploy/services/*
  template:
    metadata:
      name: "{{`{{ .path.basename }}`}}-{{ .Values.environment }}"
      # Removing a service folder also deletes its Kubernetes resources, not just the Application.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        # Must match the Pod Identity associations in Terraform.
        namespace: order-platform
      source:
        repoURL: git@github.com:EKS-V2-Alpha-Team/Alpha-Pilot-4week.git
        targetRevision: main
        path: kubernetes/charts/microservice
        helm:
          releaseName: "{{`{{ .path.basename }}`}}"
          valueFiles:
            - ../../deploy/services/{{`{{ .path.basename }}`}}/values.yaml
            - ../../deploy/envs/{{ .Values.environment }}/common.yaml
            - ../../deploy/envs/{{ .Values.environment }}/{{`{{ .path.basename }}`}}.yaml
      # Prod has no auto-sync: a release reaches prod only when someone syncs it in ArgoCD.
      syncPolicy:
        {{- if ne .Values.environment "prod" }}
        automated:
          prune: true
          selfHeal: true
        {{- end }}
        syncOptions:
          - CreateNamespace=true
