{{- if include "microservice.hasSecrets" . }}
{{- $db := .Values.database }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "microservice.fullname" . }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    # Same name as the Deployment; referenced via envFrom.secretRef.
    name: {{ include "microservice.fullname" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      # Only the keys below end up in the Kubernetes Secret. The template
      # expressions are for External Secrets to render, not Helm (hence printf).
      data:
        {{- if $db.enabled }}
        DATABASE_URL: {{ printf "postgres://{{ .db_username | urlquery }}:{{ .db_password | urlquery }}@%s:%v/%s?sslmode=%s" $db.host $db.port $db.name $db.sslMode | quote }}
        {{- end }}
        {{- range .Values.externalSecrets.env }}
        {{ .name }}: {{ printf "{{ .%s }}" .name | quote }}
        {{- end }}
  data:
    {{- if $db.enabled }}
    {{- $credentials := required "database.credentialsSecret is required when database.enabled is true" $db.credentialsSecret }}
    - secretKey: db_username
      remoteRef:
        key: {{ $credentials }}
        property: username
    - secretKey: db_password
      remoteRef:
        key: {{ $credentials }}
        property: password
    {{- end }}
    {{- range .Values.externalSecrets.env }}
    - secretKey: {{ .name }}
      remoteRef:
        key: {{ required (printf "externalSecrets.env[%s].key is required" .name) .key }}
        {{- with .property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
