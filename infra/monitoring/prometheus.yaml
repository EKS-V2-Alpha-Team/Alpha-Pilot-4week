global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yaml

# One job per service. Job names match the future Kubernetes Service names,
# so the same dashboard queries work locally and in the cluster.
# Every service exposes /metrics on container port 9090.
scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:9090"]

  - job_name: order-service
    static_configs:
      - targets: ["order-service:9090"]

  - job_name: inventory-service
    static_configs:
      - targets: ["inventory-service:9090"]

  - job_name: payment-service
    static_configs:
      - targets: ["payment-service:9090"]

  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:9090"]

  - job_name: shipping-service
    static_configs:
      - targets: ["shipping-service:9090"]

  - job_name: dashboard-api
    static_configs:
      - targets: ["dashboard-api:9090"]

  - job_name: worker
    static_configs:
      - targets: ["worker:9090"]

  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:9090"]