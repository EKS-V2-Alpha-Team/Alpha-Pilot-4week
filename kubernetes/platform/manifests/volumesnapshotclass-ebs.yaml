apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: ebs-csi
  annotations:
    # Used when a VolumeSnapshot doesn't name a class.
    snapshot.storage.kubernetes.io/is-default-class: "true"
    # The CRD comes from the snapshot-controller EKS add-on (Terraform). If it isn't there yet,
    # skip this resource instead of failing the whole platform-manifests sync.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
driver: ebs.csi.aws.com
# Deleting a VolumeSnapshot deletes its EBS snapshot, so SnapScheduler's retention cleans up.
# Snapshots survive `terraform destroy`: nothing deletes the VolumeSnapshots first.
deletionPolicy: Delete
parameters:
  tagSpecification_1: "Project=eks-v2"
