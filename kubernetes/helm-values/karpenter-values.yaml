# settings.clusterName is per environment: envs/<env>/karpenter-values.yaml

# Must match the Pod Identity association in Terraform (kube-system / karpenter).
serviceAccount:
  create: true
  name: karpenter

controller:
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
