apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: REPLACE_WITH_KARPENTER_NODE_ROLE

  amiSelectorTerms:
    - alias: al2023@latest

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: alpha-pilot-dev-cluster

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: alpha-pilot-dev-cluster

  tags:
    Project: Alpha-Pilot
    ManagedBy: Karpenter