# scheduler: runs cron jobs on an in-process ticker. Two pods = every job runs
# twice, so it is a singleton (1 replica, Recreate, no HPA). See TICKETS for
# moving jobs to CronJobs.
component: scheduler
containerPort: 8091
portEnvName: HEALTH_PORT
singleton: true

env:
  PGAPPNAME: scheduler

database:
  enabled: true

service:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
