apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.9.0
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/kubernetes/helm-values/prometheus-values.yaml
    - repoURL: git@github.com:EKS-V2-Alpha-Team/Alpha-Pilot-4week.git
      targetRevision: main
      ref: values
    - repoURL: git@github.com:EKS-V2-Alpha-Team/Alpha-Pilot-4week.git
      targetRevision: main
      path: kubernetes/charts/monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Its CRDs are too large for a normal apply ("Too long" annotation error).
      - ServerSideApply=true
