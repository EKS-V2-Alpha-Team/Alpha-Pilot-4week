prometheus:
  prometheusSpec:
    # Going with 7 days to check for weekly trends such as gradual changes or spikes
    retention: 7d
    retentionSize: 18GB
    # Collect every ServiceMonitor, including the apps' (they have no release label).
    serviceMonitorSelectorNilUsesHelmValues: false

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "gp3"
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi # can change later increase depending on load

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi

    storage: {}

# Don't add a datasource: the chart already adds the default Prometheus one,
# and two defaults stop Grafana from starting.
grafana:
  enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  service:
    type: ClusterIP

  admin:
    existingSecret: grafana-admin-credentials # linking k8 secret from AWS secret manager
    userKey: admin-user
    passwordKey: admin-password

  sidecar:
    dashboards:
      # Put each dashboard ConfigMap in the folder named by its grafana_folder annotation
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

# Only our own alerts (app-alerts). All built-in kube-prometheus-stack rules are off.
defaultRules:
  create: false

# EKS manages the control plane: these can't be scraped.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
