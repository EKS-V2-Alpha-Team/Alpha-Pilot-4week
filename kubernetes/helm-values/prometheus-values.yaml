prometheus:
  prometheusSpec:
    # Going with 7 days to check for weekly trends such as gradual changes or spikes
    retention: 7d
    retentionSize: 18GB
    # Collect every ServiceMonitor, including the apps' (they have no release label).
    serviceMonitorSelectorNilUsesHelmValues: false

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "gp2"
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi # can change later increase depending on load

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi

    storage: {}

# Don't add a datasource: the chart already adds the default Prometheus one,
# and two defaults stop Grafana from starting.
grafana:
  enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

  service:
    type: ClusterIP

  admin:
    existingSecret: grafana-admin-credentials # linking k8 secret from AWS secret manager
    userKey: admin-user
    passwordKey: admin-password

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
