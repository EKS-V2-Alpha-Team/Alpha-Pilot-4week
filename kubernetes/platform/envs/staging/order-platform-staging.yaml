# Generates one staging Application per service.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: order-platform-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: git@github.com:EKS-V2-Alpha-Team/Alpha-Pilot-4week.git
        revision: main
        directories:
          - path: kubernetes/deploy/services/*
  template:
    metadata:
      name: "{{ .path.basename }}-staging"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: order-platform-staging
      source:
        repoURL: git@github.com:EKS-V2-Alpha-Team/Alpha-Pilot-4week.git
        targetRevision: main
        path: kubernetes/charts/microservice
        helm:
          releaseName: "{{ .path.basename }}"
          valueFiles:
            - ../../deploy/services/{{ .path.basename }}/values.yaml
            - ../../deploy/envs/staging/common.yaml
            - ../../deploy/envs/staging/{{ .path.basename }}.yaml
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

