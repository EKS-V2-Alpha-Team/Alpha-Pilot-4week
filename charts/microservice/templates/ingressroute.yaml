{{- if .Values.ingressRoute.enabled }}
{{- $host := required "ingressRoute.host is required when ingressRoute.enabled is true" .Values.ingressRoute.host }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "microservice.fullname" . }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: Host(`{{ $host }}`)
      {{- with .Values.ingressRoute.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ include "microservice.fullname" . }}
          port: http
  {{- if .Values.ingressRoute.tls.enabled }}
  tls:
    secretName: {{ include "microservice.fullname" . }}-tls
  {{- end }}
{{- end }}
