# Dev values for the monitoring chart (kubernetes/charts/monitoring).
grafana:
  ingressRoute:
    enabled: true
    # Must also be listed in external-dns.alpha.kubernetes.io/hostname in
    # kubernetes/helm-values/traefik-values.yaml, or no DNS record is created.
    host: grafana.dev.eksv2.naimaosmann.com
    tls:
      enabled: true
      clusterIssuer: letsencrypt-staging  
      