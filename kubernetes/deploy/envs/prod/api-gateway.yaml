# api-gateway in prod.
image:
  tag: api-gateway-68fc760e

# Two replicas for availability and rolling updates.
replicaCount: 2

env:
  # Trust forwarded IP headers only from within the VPC.
  TRUSTED_PROXY_CIDRS: 10.6.0.0/16

externalSecrets:
  env:
    - name: JWT_SECRET
      key: eks-v2-prod-jwt-secret

ingressRoute:
  enabled: true
  host: dashboard.prod.eksv2.naimaosmann.com
  tls:
    clusterIssuer: letsencrypt-prod
