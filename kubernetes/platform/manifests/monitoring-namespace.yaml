apiVersion: v1
kind: Namespace
metadata:
  name: monitoring

# Creating this namespace because ArgoCD will apply grafana-external-secret.yaml (manifests foler) before kube-prometheus-stack.yaml (apps folder)
# grafana-external-secret.yaml needs the monitoring namespace, but that namespace would normally only be created later by kube prometheus stack.
# without this file, ArgoCD could fail to create the ExternalSecret because the monitoring namespace does not exist yet.
