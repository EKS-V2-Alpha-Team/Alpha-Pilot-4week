name: ArgoCD Bootstrap

# infra/argocd-bootstrap: installs ArgoCD, the repo credentials and the root app on the cluster
# Depends on Terraform Apply Workflow: plan and apply stop unless the EKS cluster exists and is ACTIVE
on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/argocd-bootstrap/**"
      - "kubernetes/platform/root-app-*.yaml"
      - "kubernetes/helm-values/argocd-values.yaml"
      - ".github/workflows/argocd-bootstrap.yaml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - staging
          - prod
      terraform_plan_run_id:
        description: "Run ID of the ArgoCD Bootstrap plan to apply (leave empty to only plan)"
        required: false
        type: string

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_WORKING_DIR: infra/argocd-bootstrap
  TF_VERSION: "1.16.3"

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  validate:
    name: Terraform Validate (argocd-bootstrap)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Initialize Terraform without the backend
        run: terraform init -input=false -backend=false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

  plan:
    name: Terraform Plan (argocd-bootstrap)
    if: github.event_name == 'workflow_dispatch' && inputs.terraform_plan_run_id == ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
      TF_VAR_environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config=backend/${{ inputs.environment }}.hcl

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      # Terraform can't plan this stack without the cluster so it fails rather skipping
      - name: Check the cluster is ACTIVE
        run: |
          : "${CLUSTER_NAME:?Set CLUSTER_NAME in the ${{ inputs.environment }} environment variables}"
          status=$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.status --output text 2>/dev/null || echo MISSING)
          if [ "$status" != "ACTIVE" ]; then
            echo "::error::$CLUSTER_NAME is $status, so the argocd-bootstrap plan can't run. Run Terraform workflow Apply first (and wait for it to finish), then re-run this check."
            exit 1
          fi

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan.binary

      - name: Upload plan artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tfplan-argocd-bootstrap-${{ inputs.environment || 'dev' }}
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan.binary
            ${{ env.TF_WORKING_DIR }}/.terraform.lock.hcl
          include-hidden-files: true
          retention-days: 5

      - name: Add plan to run summary
        run: |
          {
            echo "## argocd-bootstrap plan"
            echo "To apply it: run **ArgoCD Bootstrap** with run ID \`${{ github.run_id }}\`."
            echo '```'
            terraform show -no-color tfplan.binary
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Terraform Apply (argocd-bootstrap)
    if: github.event_name == 'workflow_dispatch' && inputs.terraform_plan_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    concurrency:
      group: argocd-bootstrap-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false

    env:
      CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
      TF_VAR_environment: ${{ inputs.environment }}
      APP_HOST: ${{ vars.APP_HOST }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The environment's pipeline role has cluster-admin through the access entry
      # Terraform adds in the eks module (authentication_mode = API).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # The cluster may have been destroyed or be mid-rebuild since the plan was made.
      - name: Check the cluster is ACTIVE
        run: |
          : "${CLUSTER_NAME:?Set CLUSTER_NAME in the ${{ inputs.environment }} environment variables}"
          status=$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.status --output text 2>/dev/null || echo MISSING)
          if [ "$status" != "ACTIVE" ]; then
            echo "::error::$CLUSTER_NAME is $status. Run Terraform Apply first, then plan this workflow again."
            exit 1
          fi

      # Before init, so init installs the provider versions from the plan's lock file.
      - name: Download Terraform Plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tfplan-argocd-bootstrap-${{ inputs.environment || 'dev' }}
          run-id: ${{ inputs.terraform_plan_run_id }}
          path: ${{ env.TF_WORKING_DIR }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config=backend/${{ inputs.environment }}.hcl

      # Terraform refuses a stale plan (state changed since it was made): re-plan and retry
      - name: Terraform Apply
        run: terraform apply -input=false tfplan.binary

      - name: Configure kubectl
        run: |
          : "${CLUSTER_NAME:?Set CLUSTER_NAME in the ${{ inputs.environment }} environment variables}"
          : "${APP_HOST:?Set APP_HOST in the ${{ inputs.environment }} environment variables}"
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      # Prod services have no auto-sync (someone syncs each release), so for prod
      # this waits for the platform only.
      - name: Wait for all Applications to be Synced and Healthy
        working-directory: .
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          platform=$(helm template kubernetes/platform/apps --set environment="$ENVIRONMENT" | grep -c '^kind: Application$')
          services=$(find kubernetes/deploy/services -mindepth 1 -maxdepth 1 -type d | wc -l)
          skip=""
          if [ "$ENVIRONMENT" = "prod" ]; then
            services=0
            skip="-prod"
          fi
          expected=$(( 1 + platform + services ))
          deadline=$(( $(date +%s) + 30 * 60 ))
          while true; do
            if ! all=$(kubectl -n argocd get applications -o json); then
              echo "kubectl failed, retrying"
              sleep 20
              continue
            fi
            apps=$(jq --arg skip "$skip" '{items: [.items[] | select($skip == "" or (.metadata.name | endswith($skip) | not))]}' <<<"$all")
            total=$(jq '.items | length' <<<"$apps")
            ready=$(jq '[.items[] | select(.status.sync.status == "Synced" and .status.health.status == "Healthy")] | length' <<<"$apps")
            echo "$ready/$expected Applications Synced and Healthy ($total found)"
            if [ "$total" -ge "$expected" ] && [ "$ready" -eq "$total" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for Applications"
              exit 1
            fi
            sleep 20
          done
          kubectl -n argocd get applications

      - name: Check the app is reachable
        if: inputs.environment != 'prod'
        run: |
          kubectl -n traefik get svc traefik
          for i in $(seq 1 40); do
            if curl -sfk --max-time 10 "https://$APP_HOST/healthz"; then
              echo
              echo "https://$APP_HOST is up ✅"
              echo "App: https://$APP_HOST" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Not reachable yet (attempt $i)"
            sleep 15
          done
          echo "::error::https://$APP_HOST did not respond"
          exit 1

      - name: Diagnostics
        if: failure()
        run: |
          set +e
          kubectl -n argocd get applications
          for app in $(kubectl -n argocd get applications -o json \
              | jq -r '.items[] | select(.status.health.status != "Healthy" or .status.sync.status != "Synced") | .metadata.name'); do
            echo "=== $app"
            kubectl -n argocd get application "$app" -o json | jq '.status.conditions, .status.operationState.message, [.status.resources[]? | select(.health != null and .health.status != "Healthy")]'
          done
          kubectl get pods -A | grep -v -E 'Running|Completed'
          kubectl get pvc -A | grep -v Bound
          kubectl -n traefik get svc traefik -o wide
          kubectl -n order-platform get ingressroute,certificate,externalsecret
          kubectl -n external-dns logs deploy/external-dns --tail=50
          dig +short "$APP_HOST"
