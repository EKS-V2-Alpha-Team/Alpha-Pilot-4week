apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: grafana-admin-password
  namespace: monitoring

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
    template:
      data:
        admin-user: admin # grafana needs 2 keys (username AND password)
        admin-password: "{{ .grafanaPassword }}"

  data:
    - secretKey: grafanaPassword #temporary label= we can call this anything , it is linking password to admin-password which is mentioned line 21 ^
      remoteRef:
        key: eks-v2-staging-grafana-password
